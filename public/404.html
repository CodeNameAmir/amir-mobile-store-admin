<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال انتقال به پنل مدیریت فروشگاه موبایل امیر...</title>
    <script>
      (function () {
        var l = window.location;
        var path = l.pathname || '/';
        var search = l.search || '';
        if (path !== '/' && path !== '/index.html') {
          l.replace(l.protocol + '//' + l.host + '/#' + path + search);
        } else {
          l.replace(l.protocol + '//' + l.host + '/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
